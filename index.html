<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hoàn tất nhiệm vụ</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f1f5f9;color:#0f172a}
.card{width:min(440px,100%);background:#fff;border-radius:22px;padding:30px;box-shadow:0 12px 40px rgba(15,23,42,.12);text-align:center}
.icon{width:70px;height:70px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:#e2e8f0;font-size:30px}
h1{font-size:24px;margin:0 0 10px}p{color:#64748b;line-height:1.55;margin:8px 0}.status{margin:22px 0;padding:14px;border-radius:14px;background:#f8fafc;font-weight:600}
.ok{background:#ecfdf5;color:#047857}.err{background:#fef2f2;color:#b91c1c}button{width:100%;border:0;border-radius:13px;padding:13px 16px;background:#0f172a;color:white;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}.small{font-size:12px;color:#94a3b8;margin-top:18px}
</style>
</head>
<body>
<main class="card">
<div id="icon" class="icon">✓</div>
<h1>Hoàn tất nhiệm vụ</h1>
<p id="message">Bấm nút bên dưới để đớp tiền.</p>
<div id="status" class="status ok">Sẵn sàng nhận thưởng</div>
<button id="complete" type="button">✅ Hoàn tất & nhận 500đ</button>
<p class="small">Bot sẽ tự mở /start và xử lý mã nhiệm vụ.</p>
</main>
<script>
(() => {
  const TELEGRAM_BOT_USERNAME = "Umohvt_bot";
  const params = new URLSearchParams(location.search);
  const task = (params.get("task") || "").trim();
  const button = document.getElementById("complete");
  const status = document.getElementById("status");
  const message = document.getElementById("message");
  const icon = document.getElementById("icon");

  function goTelegram() {
    if (!task || !/^[a-z0-9]{8,200}$/.test(task)) {
      icon.textContent = "!";
      status.className = "status err";
      status.textContent = "Mã nhiệm vụ không hợp lệ";
      message.textContent = "Hãy mở lại link nhiệm vụ từ bot.";
      return;
    }
    status.textContent = "Đang mở Telegram...";
    message.textContent = "Quay lại bot để nhận 400đ.";
    button.disabled = true;
    button.textContent = "Đang chuyển...";
    location.replace("https://t.me/" + TELEGRAM_BOT_USERNAME + "?start=" + encodeURIComponent("gt_" + task));
  }

  if (!task || !/^[a-z0-9]{8,200}$/.test(task)) {
    icon.textContent = "!";
    status.className = "status err";
    status.textContent = "Thiếu hoặc sai mã nhiệm vụ";
    message.textContent = "Hãy mở lại link nhiệm vụ từ bot.";
    button.disabled = true;
  } else {
    button.addEventListener("click", goTelegram);
  }
})();
</script>
</body>
</html>
