<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eef2f7">
  <title>Hoàn tất nhiệm vụ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #eef2f7;
      font-family: Arial, sans-serif;
      color: #111827;
    }

    .card {
      width: 100%;
      max-width: 620px;
      background: white;
      border-radius: 30px;
      padding: 42px 28px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(0,0,0,.10);
    }

    .icon {
      width: 125px;
      height: 125px;
      margin: 0 auto 28px;
      border-radius: 50%;
      background: #e5ebf2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 32px;
    }

    .message {
      margin: 0;
      color: #64748b;
      font-size: 19px;
      line-height: 1.5;
    }

    .status {
      margin: 28px 0;
      padding: 20px;
      border-radius: 18px;
      background: #e9f8ef;
      color: #16803c;
      font-size: 18px;
      font-weight: bold;
    }

    .error {
      background: #fff0f0;
      color: #b42318;
    }

    button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 18px;
      background: #111827;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    .note {
      margin-top: 24px;
      color: #94a3b8;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icon" id="icon">✓</div>

    <h1 id="title">Hoàn tất nhiệm vụ</h1>

    <p class="message" id="message">
      Đang xử lý nhiệm vụ...
    </p>

    <div class="status" id="status">
      Đang kiểm tra...
    </div>

    <button id="openTelegram" class="hidden">
      Mở lại Telegram
    </button>

    <div class="note">
      Mã nhiệm vụ chỉ được xử lý một lần ở bot.
    </div>

  </div>


<script>

  /*
   * ================================
   * CẤU HÌNH BOT
   * ================================
   *
   * Không thêm dấu @
   */
  const TELEGRAM_BOT_USERNAME = "Umohvt_bot";


  /*
   * ================================
   * LẤY TASK TỪ URL
   * ================================
   */

  const params = new URLSearchParams(
    window.location.search
  );

  const task = (params.get("task") || "").trim();


  /*
   * ================================
   * ELEMENT
   * ================================
   */

  const icon = document.getElementById("icon");
  const title = document.getElementById("title");
  const message = document.getElementById("message");
  const status = document.getElementById("status");
  const openTelegram =
    document.getElementById("openTelegram");


  /*
   * ================================
   * TẠO LINK TELEGRAM
   * ================================
   */

  function getTelegramUrl() {

    return (
      "https://t.me/" +
      TELEGRAM_BOT_USERNAME +
      "?start=" +
      encodeURIComponent("gt_" + task)
    );

  }


  /*
   * ================================
   * MỞ TELEGRAM
   * ================================
   */

  function goTelegram() {

    window.location.href = getTelegramUrl();

  }


  /*
   * ================================
   * KIỂM TRA CẤU HÌNH
   * ================================
   */

  if (
    !TELEGRAM_BOT_USERNAME ||
    TELEGRAM_BOT_USERNAME === "YOUR_BOT_USERNAME"
  ) {

    icon.textContent = "!";

    title.textContent = "Hoàn tất nhiệm vụ";

    message.textContent =
      "Trang chưa được cấu hình username Telegram.";

    status.textContent =
      "Chưa cấu hình bot";

    status.classList.add("error");

    openTelegram.classList.remove("hidden");

  }


  /*
   * ================================
   * KIỂM TRA USERNAME
   * ================================
   */

  else if (
    !/^[A-Za-z0-9_]{5,64}$/.test(
      TELEGRAM_BOT_USERNAME
    )
  ) {

    icon.textContent = "!";

    title.textContent = "Lỗi cấu hình";

    message.textContent =
      "Username Telegram không hợp lệ.";

    status.textContent =
      "Kiểm tra lại TELEGRAM_BOT_USERNAME";

    status.classList.add("error");

  }


  /*
   * ================================
   * KIỂM TRA TASK
   * ================================
   */

  else if (
    !/^[A-Za-z0-9_-]{8,200}$/.test(task)
  ) {

    icon.textContent = "!";

    title.textContent =
      "Mã nhiệm vụ không hợp lệ";

    message.textContent =
      "Vui lòng mở trang từ liên kết nhiệm vụ do bot cung cấp.";

    status.textContent =
      "Thiếu hoặc sai mã task";

    status.classList.add("error");

  }


  /*
   * ================================
   * HỢP LỆ
   * ================================
   */

  else {

    icon.textContent = "✓";

    title.textContent =
      "Hoàn tất nhiệm vụ";

    message.textContent =
      "Đang mở Telegram để tiếp tục...";

    status.textContent =
      "Đã nhận mã nhiệm vụ";

    openTelegram.textContent =
      "Mở lại Telegram";

    openTelegram.classList.remove("hidden");


    /*
     * Tự động mở Telegram
     */
    setTimeout(
      goTelegram,
      900
    );

  }


  /*
   * ================================
   * NÚT MỞ LẠI
   * ================================
   */

  openTelegram.addEventListener(
    "click",
    goTelegram
  );

</script>

</body>
</html>
