<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hoàn tất nhiệm vụ</title>
  <meta name="theme-color" content="#0f172a">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:#f1f5f9;color:#0f172a}
    .card{width:min(440px,100%);background:#fff;border-radius:22px;padding:30px;
      box-shadow:0 12px 40px rgba(15,23,42,.12);text-align:center}
    .icon{width:70px;height:70px;margin:0 auto 18px;border-radius:50%;
      display:grid;place-items:center;background:#e2e8f0;font-size:30px}
    h1{font-size:24px;margin:0 0 10px}
    p{color:#64748b;line-height:1.55;margin:8px 0}
    .status{margin:22px 0;padding:14px;border-radius:14px;background:#f8fafc;font-weight:600}
    .ok{background:#ecfdf5;color:#047857}.err{background:#fef2f2;color:#b91c1c}
    button{width:100%;border:0;border-radius:13px;padding:13px 16px;background:#0f172a;
      color:white;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
    .small{font-size:12px;color:#94a3b8;margin-top:18px}
  </style>
</head>
<body>
<main class="card">
  <div id="icon" class="icon">⏳</div>
  <h1>Hoàn tất nhiệm vụ</h1>
  <p id="message">Đang xử lý...</p>
  <div id="status" class="status">Đang chuẩn bị quay lại Telegram...</div>
  <button id="back" type="button" hidden>Mở lại Telegram</button>
  <p class="small">Mã nhiệm vụ chỉ được xử lý một lần ở bot.</p>
</main>

<script>
(() => {
  // Chỉ sửa username bot tại đây, không có @.
  const TELEGRAM_BOT_USERNAME = "Umohvt_bot";
  const params = new URLSearchParams(location.search);
  const task = (params.get("task") || "").trim();

  const icon = document.getElementById("icon");
  const message = document.getElementById("message");
  const status = document.getElementById("status");
  const back = document.getElementById("back");

  function state(type, title, text) {
    status.textContent = title;
    message.textContent = text;
    status.className = "status " + (type || "");
    icon.textContent = type === "ok" ? "✓" : type === "err" ? "!" : "⏳";
  }

  function telegramUrl() {
    return "https://t.me/" + TELEGRAM_BOT_USERNAME +
           "?start=" + encodeURIComponent("gt_" + task);
  }

  function goTelegram() {
    if (TELEGRAM_BOT_USERNAME === "Umohvt_bot") {
      state("err", "Chưa cấu hình bot",
            "Hãy sửa TELEGRAM_BOT_USERNAME trong index.html.");
      back.hidden = false;
      return;
    }
    location.replace(telegramUrl());
  }

  back.addEventListener("click", goTelegram);

  if (!task) {
    state("err", "Thiếu mã nhiệm vụ",
          "Liên kết không có tham số task. Hãy mở lại link từ bot.");
    return;
  }

  // task_id do bot sinh ra chỉ chứa chữ thường và số.
  if (!/^[a-z0-9]{8,200}$/.test(task)) {
    state("err", "Mã nhiệm vụ không hợp lệ",
          "Vui lòng mở lại liên kết từ bot Telegram.");
    return;
  }

  if (TELEGRAM_BOT_USERNAME === "Umohvt_bot") {
    state("err", "Chưa cấu hình bot",
          "Hãy sửa TELEGRAM_BOT_USERNAME trước khi dùng.");
    back.hidden = false;
    return;
  }

  state("ok", "Đã hoàn tất", "Đang mở Telegram để nhận kết quả...");
  back.hidden = false;

  // Tự động quay về bot sau một khoảng rất ngắn.
  setTimeout(goTelegram, 900);
})();
</script>
</body>
</html>
